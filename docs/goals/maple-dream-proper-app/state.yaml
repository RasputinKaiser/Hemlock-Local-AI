      - dream-chat/electron/agent_orchestrator.cjs
      - dream-chat/electron/agent_orchestrator.test.cjs
      - dream-chat/evals/tool-use/benchmark.json
      - "npm run verify:agent: passed"
      - "Actual MLX LoRA tool-use smoke passed with unchanged base digest; receipt is under ~/Library/Application Support/Hemlock/workspace-runtime/dream-runs/strong-agent-tool-use-smoke-20260814/"
      - "Live candidate structured-action probes reached a healthy Maple server but did not produce a valid action envelope: one hit the token limit in reasoning/prose and a no-thinking retry invented list_directory; candidate remains training_completed_candidate_pending"
