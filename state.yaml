maple_adaptive_capability_loop_2026_08_15:
  status: implemented_verified
  model_freedom: "An approved plan is now a user-approved capability boundary and starting direction, not a positional command script. Maple receives the current evidence, the current planned step, and an allowlisted allowedNextCommands set, then may select the next useful safe read, inspect, verify, artifact, preview, or plan-approved write action."
  adaptive_plan: "When Maple selects an allowlisted action outside the current step, Hemlock either moves that action forward from the remaining approved plan or inserts a host-owned adaptive step. The plan records adaptiveDecisions, plan.adapted is emitted, and action.hostSelection records requested versus selected command identity."
