rlcd_scored_choice_2026_09_20:
  status: implemented_verified
  trigger: "User pointed at notnotsamuel/LFM2.5-350M-RLCD — parallel constrained decoding (prefill once, batch-score candidates, assemble JSON in Python, 8-63x vs autoregressive). Applied the concept to Maple's agent action selection."
  changes:
    score_endpoint: "New POST /v1/score on the fork's mlx_lm server (server.py): takes messages|prompt + prompt_suffix + candidates[], prefills once with LRU prompt-cache reuse (fetched at prompt[:-1] so the last token is always forwarded), then teacher-forces each candidate against a deepcopied cache — one small forward per candidate. Returns per-candidate logprob + avgLogprob + tokens. Runs on the generation thread so it serializes with generation; non-batchable semantics (drains an active batch like other non-batchable requests). Old servers 404 -> scoreEndpointUnsupported flag degrades quietly for the session."
    scored_choice_path: "agent_orchestrator infer() now tries scored-choice before generation: buildScoreCandidates enumerates allowedNextCommands + terminal kinds as minimal candidate continuations — complete envelopes for input-free commands, one per experiment kind for experiment.run (6), one per profile for verify (3), decision prefixes for free-input commands (artifact.author, code.apply, file.search/read, context.search/query, receipt.inspect, experiment.note) and terminals. pickScoredCandidate picks max avgLogprob. A complete winner is already a valid compact envelope -> parseModelResult -> zero generated tokens, nothing to misparse. A prefix winner records progress.scoredDecision and falls through to generation for the free fields. Scoring failure -> degraded event + generative fallback."
    think_suffix: "Maple's chat template hardcodes <|im_start|>assistant\\n<think>\\n — scoring sends prompt_suffix '</think>\\n\\n' so candidates score as the action JSON directly (a no-think decision probe)."
  verification:
    unit: "4 new tests in agent_orchestrator.test.cjs: complete winner executes with zero generative calls + action.scored telemetry; prefix winner falls through with scoredDecision injected; scoring failure degrades quietly; candidate enumeration (6 experiment kinds, 3 verify profiles, all complete candidates parse as JSON) and pickScoredCandidate margin."
    endpoint_live: "Draft model (qwen25-0.5b) served the real endpoint: sane candidate ordering (answer beats tool calls for a Q&A prompt), prefix cache reuse confirmed (40 cached tokens on repeat)."
    maple_correctness: "VERIFIED ON REAL MAPLE: block-append teacher-forcing after chunked prefill matches a fresh full-forward within 0.18 logprob (bf16 noise). IMPORTANT INVERSION — the single-token decode path deviated 16 logprob because Model.__call__ routes 1-token calls through the approximate FlashHead (maple.py:986-993); the earlier 'block-append corrupts logits' belief was backwards. Scoring's multi-token path uses the exact lm_head."
